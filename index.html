<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlowGrid915 Telemetry Portal</title>
  
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
    
    /* Hardware Node Marker */
    .node-marker {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #ffffff; box-shadow: 0 0 12px rgba(0,0,0,0.8);
      cursor: pointer; transition: background-color 0.3s ease;
    }
    .marker-nominal { background-color: #3fb950; }
    .marker-alert { background-color: #f85149; box-shadow: 0 0 15px #f85149; }

    /* Custom Dark Mode Popups */
    .mapboxgl-popup-content {
      background: rgba(22, 27, 34, 0.95) !important;
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      padding: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #30363d !important; }
    .mapboxgl-popup-close-button { color: #8b949e; font-size: 16px; padding: 4px 8px; }
    .mapboxgl-popup-close-button:hover { background: transparent; color: #f85149; }

    /* Telemetry Data Formatting */
    .popup-title { font-size: 0.9rem; color: #58a6ff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #21262d; padding-bottom: 5px; }
    .metric-row { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 6px; }
    .metric-label { color: #8b949e; font-size: 0.85rem; }
    .metric-val { font-weight: 600; font-family: monospace; font-size: 0.9rem; }
    .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; }
    .status-nominal { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; }
    .status-alert { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #f85149; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    // 1. MAPBOX INITIALIZATION (Token Injected)
    mapboxgl.accessToken = 'pk.eyJ1IjoiZmxvd2dyaWQ5MTUiLCJhIjoiY212Z3owbjZzMDNibDJ5cG13aDh6cTBkYyJ9.ZIFZPkMqFyoEgv-8fThhnw';
    
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      // REQUIRED: Replace with your extracted coordinates [Lng, Lat]
      center: [123.9961, 12.9754], 
      zoom: 15.5,
      projection: 'globe'
    });

    // 2. FIREBASE INITIALIZATION
    // REQUIRED: Replace ALL placeholder strings below with your exact Firebase project keys
    const firebaseConfig = {
      apiKey: "AIzaSyBQk20ERtOKC37cEclh7iJzosM1T79EOVo",
      authDomain: "flowgrid915.firebaseapp.com",
      databaseURL: "https://flowgrid915-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "flowgrid915",
      storageBucket: "flowgrid915.appspot.com",
      messagingSenderId: "751566556885",
      appId: "1:751566556885:web:c691fd33592ec6f1045c5c"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const nodeRef = ref(db, 'nodes/dev_node_01');

    // 3. NODE MARKER AND EVENT STATE
    const el = document.createElement('div');
    el.className = 'node-marker marker-nominal';
    
    // REQUIRED: Replace with your extracted coordinates [Lng, Lat]
    const marker = new mapboxgl.Marker(el)
      .setLngLat([123.9961, 12.9754])
      .addTo(map);

    const hoverPopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, offset: 15, maxWidth: '200px' });
    const clickPopup = new mapboxgl.Popup({ closeButton: true, offset: 15, maxWidth: '300px' });

    // Mutable state variables to hold live telemetry for popups
    let liveData = { status: 'Connecting...', pressure_mpa: '--', lat: 0, lng: 0 };
    let isInitialLoad = true;

    // 4. DOM EVENT LISTENERS (Hover & Click Architecture)
    el.addEventListener('mouseenter', () => {
      if (clickPopup.isOpen()) return; // Do not show hover if clicked expanded view is active
      const badgeClass = liveData.status === 'nominal' ? 'status-nominal' : 'status-alert';
      hoverPopup.setLngLat(marker.getLngLat())
        .setHTML(`<span class="status-badge ${badgeClass}">${liveData.status}</span>`)
        .addTo(map);
    });

    el.addEventListener('mouseleave', () => {
      hoverPopup.remove();
    });

   el.addEventListener('click', (e) => {
      e.stopPropagation(); // PREVENTS MAP FROM INSTANTLY CLOSING THE POPUP
      hoverPopup.remove();
      
      const badgeClass = liveData.status === 'nominal' ? 'status-nominal' : 'status-alert';
      
      // Enforce number type parsing to prevent .toFixed() exceptions if Firebase saved data as strings
      const safeLat = Number(liveData.lat) || 0;
      const safeLng = Number(liveData.lng) || 0;

      clickPopup.setLngLat(marker.getLngLat())
        .setHTML(`
          <div class="popup-title">Node: dev_node_01</div>
          <div class="metric-row"><span class="metric-label">Status</span><span class="status-badge ${badgeClass}">${liveData.status}</span></div>
          <div class="metric-row"><span class="metric-label">Pressure</span><span class="metric-val">${liveData.pressure_mpa} MPa</span></div>
          <div class="metric-row"><span class="metric-label">Coordinates</span><span class="metric-val">${safeLat.toFixed(4)}, ${safeLng.toFixed(4)}</span></div>
        `)
        .addTo(map);
    });

    // 5. RTDB TELEMETRY LISTENER
    onValue(nodeRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return; // Silent fail if database node is missing

      liveData = data; // Update state for popups

      // Update Marker Color
      el.className = data.status === 'nominal' ? 'node-marker marker-nominal' : 'node-marker marker-alert';

      // Update Coordinate Geometry
      marker.setLngLat([data.lng, data.lat]);
      
      // Update open popups dynamically
      if (hoverPopup.isOpen() || clickPopup.isOpen()) {
        const badgeClass = data.status === 'nominal' ? 'status-nominal' : 'status-alert';
        if (hoverPopup.isOpen()) hoverPopup.setHTML(`<span class="status-badge ${badgeClass}">${data.status}</span>`);
        if (clickPopup.isOpen()) {
          clickPopup.setHTML(`
            <div class="popup-title">Node: dev_node_01</div>
            <div class="metric-row"><span class="metric-label">Status</span><span class="status-badge ${badgeClass}">${data.status}</span></div>
            <div class="metric-row"><span class="metric-label">Pressure</span><span class="metric-val">${data.pressure_mpa} MPa</span></div>
            <div class="metric-row"><span class="metric-label">Coordinates</span><span class="metric-val">${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}</span></div>
          `);
        }
      }

      if (isInitialLoad || data.status !== 'nominal') {
        map.flyTo({ center: [data.lng, data.lat], zoom: 15.5, essential: true });
        isInitialLoad = false;
      }
    });
  </script>
</body>
</html>
